<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đăng nhập Admin - CTV GIA KHÁNH</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#e9faf5;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    width:390px;
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.1);
}

.logo{
    display:block;
    width:70px;
    height:70px;
    object-fit:contain;
    margin:0 auto 15px;
    border-radius:15px;
}

.logo-fallback{
    width:70px;
    height:70px;
    border-radius:15px;
    background:#00a88b;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:bold;
    margin:0 auto 15px;
}

h1{
    text-align:center;
    color:#00a88b;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:28px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:9px;
    margin-bottom:18px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#00a88b;
}

.login-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:9px;
    background:#00a88b;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    background:#008f77;
}

.error{
    color:#e53935;
    text-align:center;
    margin-top:15px;
    display:none;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#00a88b;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="login-box">

    <img src="logo.png"
         class="logo"
         id="logo"
         onerror="this.style.display='none';document.getElementById('fallback').style.display='flex';">

    <div id="fallback" class="logo-fallback" style="display:none;">
        G
    </div>

    <h1>Đăng nhập Admin</h1>

    <p class="subtitle">
        CTV GIA KHÁNH
    </p>

    <form id="loginForm">

        <label>Tên đăng nhập</label>

        <input
            type="text"
            id="username"
            placeholder="Nhập tên đăng nhập"
            required
        >

        <label>Mật khẩu</label>

        <input
            type="password"
            id="password"
            placeholder="Nhập mật khẩu"
            required
        >

        <button type="submit" class="login-btn">
            Đăng nhập Admin
        </button>

        <div class="error" id="error">
            Sai tên đăng nhập hoặc mật khẩu!
        </div>

    </form>

    <a href="index.html" class="back">
        ← Quay lại trang chủ
    </a>

</div>

<script>

const ADMIN_USERNAME = "maitiendat";
const ADMIN_PASSWORD = "2012";

document.getElementById("loginForm").addEventListener("submit", function(e){

    e.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    if(
        username === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
    ){

        sessionStorage.setItem(
            "adminLoggedIn",
            "true"
        );

        window.location.href = "admin.html";

    }else{

        document.getElementById("error").style.display = "block";

    }

});

</script>

</body>
</html>
